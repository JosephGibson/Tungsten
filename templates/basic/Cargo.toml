[package]
name = "tungsten-template-basic"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
tungsten = { path = "../../crates/tungsten" }

[dev-dependencies]
tungsten = { path = "../../crates/tungsten", features = ["testing"] }
