# Release builds (D-071, D-072, D-079, D-120, D-122). A final vX.Y.Z tag
# publishes when the pull request whose head commit it names merges into main;
# a pushed pre-release tag (vX.Y.Z-<pre>) publishes at once; a manual run on a
# tag covers maintenance and recovery. Each run checks the tag against
# Cargo.toml and CHANGELOG.md, builds the examples for Linux and Windows at two
# x86-64 CPU levels, and publishes one archive per platform (both builds, a
# launcher per example that runs the fastest one the CPU supports, the files
# the examples read and the third-party license notices), one debug archive per
# platform (each build's split .debug file or PDB), SHA256SUMS and the matching
# changelog section as notes. A vX.Y.Z-<pre> tag without its own changelog
# section is a rehearsal, published as a pre-release. Hosted runners have no
# GPU: nothing with a window is launched. The one program run is the
# crash-report probe, which needs none and reports without failing the run
# (D-070, D-120). Release steps and recovery: docs/releases.md.
name: Release

on:
  # Pre-release tags only: pushing a final tag publishes nothing by itself.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  pull_request:
    types: [closed]
    branches: [main]
  # gh workflow run release.yml --ref vX.Y.Z
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Tag, version and changelog agree
    # A pull request closed without merging, or from a fork, releases nothing.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.select.outputs.tag }}
      sha: ${{ steps.select.outputs.sha }}
    steps:
      # A merged pull request releases its head commit, the one the tag names;
      # an empty ref is the default checkout of the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Leaves `tag` empty, skipping the build, when a merge isn't a release.
      - name: Select the release tag
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            if [[ "$GITHUB_REF_TYPE" != tag ]]; then
              echo "::error::Run this workflow on a tag: gh workflow run release.yml --ref vX.Y.Z"
              exit 1
            fi
            tag=$GITHUB_REF_NAME
          else
            tag="v$(python3 -B scripts/release.py version)"
            # The commit the tag names; empty when the tag doesn't exist.
            tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$tag" --jq .sha 2>/dev/null) || tagged=""
            if [[ "$tagged" != "$head" ]]; then
              if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --silent 2>/dev/null; then
                echo "::notice::$tag is already released; this merge publishes nothing."
                exit 0
              fi
              echo "::error::$tag is unreleased and names ${tagged:-no commit}, not the merged head $head. See docs/releases.md, Recover according to state."
              exit 1
            fi
            # main must hold exactly what was tested and tagged.
            merged_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$MERGE_SHA" --jq .tree.sha)
            if [[ "$merged_tree" != "$(git rev-parse 'HEAD^{tree}')" ]]; then
              echo "::error::Merge commit $MERGE_SHA differs from the tree $tag names. See docs/releases.md, Recover according to state."
              exit 1
            fi
          fi
          python3 -B scripts/release.py check "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$head" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    if: needs.verify.outputs.tag != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      matrix:
        include:
          # Pinned image: its glibc (2.39) caps what the Linux binaries require.
          # An explicit build-id, which packaging and symbolization check (D-120),
          # whatever the runner's compiler defaults to.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            extra_rustflags: "-C link-arg=-Wl,--build-id"
            python: python3
          # Static CRT: players don't need the Visual C++ redistributable.
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            extra_rustflags: "-C target-feature=+crt-static"
            python: python
    env:
      TARGET: ${{ matrix.target }}
      # Fastest first; each level builds into target/<level>. x86-64 is the
      # portable fallback and supplies the launcher. Measured in D-072.
      CPU_LEVELS: x86-64-v3 x86-64
      EXTRA_RUSTFLAGS: ${{ matrix.extra_rustflags }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      # Same list as ci.yml. cpal needs pkg-config and ALSA headers; no locked
      # crate links udev. X11/Wayland, xkbcommon and Vulkan load at run time.
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev

      # Reads rust-toolchain.toml. No cache: a cache saved on a tag ref is
      # rarely restored, and release builds start clean.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          build-warnings: ""
          cache: false

      # Binary targets are the examples and the launcher; the template ships in
      # no archive, so it is left out. The tuned profile's line tables stay in,
      # for the debug archive (D-120). A set RUSTFLAGS replaces target-cpu=native
      # from .cargo/config.toml.
      - name: Build release binaries per CPU level
        run: |
          for level in $CPU_LEVELS; do
            RUSTFLAGS="-C target-cpu=$level $EXTRA_RUSTFLAGS" cargo build --release --locked \
              --workspace --exclude tungsten-crash-probe --exclude tungsten-template-basic --bins \
              --target "$TARGET" --target-dir "target/$level"
          done

      # The crates the shipped binaries link, with their license files, and the
      # toolchain's standard-library notices, from which packaging writes each
      # archive's third-party notices (D-122). It lands at the artifact's root.
      - name: Collect license data
        run: |
          ${{ matrix.python }} -B scripts/release.py licenses "$TARGET" --out target/licenses.json

      # Once, at the portable level, into its target dir: only the probe's crate compiles.
      - name: Build the crash-report probe
        run: |
          RUSTFLAGS="-C target-cpu=x86-64 $EXTRA_RUSTFLAGS" cargo build --release --locked \
            -p tungsten-crash-probe --target "$TARGET" --target-dir target/x86-64

      # A panic in the shipped layout leaves a crash file that symbolizes from the
      # split debug file (Linux) or the PDB (Windows). Informational: a failure here
      # is read on the rehearsal run, never fails the release (D-120).
      - name: Crash-report probe
        continue-on-error: true
        run: |
          ${{ matrix.python }} -B scripts/crash-report.py probe "target/x86-64/$TARGET/release" --target "$TARGET"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: |
            target/*/${{ matrix.target }}/release/example-*
            target/*/${{ matrix.target }}/release/example_*.pdb
            target/x86-64/${{ matrix.target }}/release/tungsten-launcher*
            target/licenses.json
            !target/*/${{ matrix.target }}/release/*.d
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Package and publish
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          path: artifacts

      # A player and a debug archive per built target, then checksums over all of
      # them. Packaging splits each Linux binary with objcopy and checks every
      # debug file against its binary (D-120), and writes the notices from the
      # build job's licenses.json, failing on a crate without a license text (D-122).
      - name: Package archives and checksums
        run: |
          for dir in artifacts/bin-*; do
            python3 -B scripts/release.py package "$RELEASE_TAG" "${dir#artifacts/bin-}" \
              --bin-dir "$dir" --out dist
          done
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes from CHANGELOG.md
        run: |
          python3 -B scripts/release.py notes "$RELEASE_TAG" \
            --link-base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$RELEASE_TAG" > release-notes.md

      # gh stages assets in a draft before publication. Existing drafts/releases
      # need inspection before retrying this create step; see docs/releases.md.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Tungsten $RELEASE_TAG" --notes-file release-notes.md "${flags[@]}"
