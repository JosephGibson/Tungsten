# Tag-triggered release (D-071, D-072). Pushing vX.Y.Z checks the tag against
# Cargo.toml and CHANGELOG.md, builds the examples for Linux and Windows at two
# x86-64 CPU levels, and publishes one archive per platform (both builds, a
# launcher per example that runs the fastest one the CPU supports, and the files
# the examples read), SHA256SUMS and the matching changelog section as notes. A vX.Y.Z-<pre> tag without its own changelog section is a
# rehearsal, published as a pre-release.
# Build only: hosted runners have no GPU, so nothing is launched (D-070).
# Release steps: README.md "Releases".
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Tag, version and changelog agree
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag against Cargo.toml and CHANGELOG.md
        run: python3 -B scripts/release.py check "$GITHUB_REF_NAME"

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      matrix:
        include:
          # Pinned image: its glibc (2.39) caps what the Linux binaries require.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            extra_rustflags: ""
          # Static CRT: players don't need the Visual C++ redistributable.
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            extra_rustflags: "-C target-feature=+crt-static"
    env:
      TARGET: ${{ matrix.target }}
      # Fastest first; each level builds into target/<level>. x86-64 is the
      # portable fallback and supplies the launcher. Measured in D-072.
      CPU_LEVELS: x86-64-v3 x86-64
      EXTRA_RUSTFLAGS: ${{ matrix.extra_rustflags }}
      # Same codegen as the tuned release profile (D-041); only the line tables
      # kept there for local profiling are dropped.
      CARGO_PROFILE_RELEASE_STRIP: debuginfo
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same list as ci.yml. cpal needs pkg-config and ALSA headers; no locked
      # crate links udev. X11/Wayland, xkbcommon and Vulkan load at run time.
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev

      # Reads rust-toolchain.toml. No cache: a cache saved on a tag ref is
      # rarely restored, and release builds start clean.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          build-warnings: ""
          cache: false

      # Binary targets are the examples and the launcher. A set RUSTFLAGS
      # replaces target-cpu=native from .cargo/config.toml.
      - name: Build release binaries per CPU level
        run: |
          for level in $CPU_LEVELS; do
            RUSTFLAGS="-C target-cpu=$level $EXTRA_RUSTFLAGS" cargo build --release --locked \
              --workspace --bins --target "$TARGET" --target-dir "target/$level"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: |
            target/*/${{ matrix.target }}/release/example-*
            target/x86-64/${{ matrix.target }}/release/tungsten-launcher*
            !target/*/${{ matrix.target }}/release/*.d
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Package and publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          path: artifacts

      # One archive per built target, then checksums over all of them.
      - name: Package archives and checksums
        run: |
          for dir in artifacts/bin-*; do
            python3 -B scripts/release.py package "$GITHUB_REF_NAME" "${dir#artifacts/bin-}" \
              --bin-dir "$dir" --out dist
          done
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes from CHANGELOG.md
        run: |
          python3 -B scripts/release.py notes "$GITHUB_REF_NAME" \
            --link-base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME" > release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Tungsten $GITHUB_REF_NAME" --notes-file release-notes.md "${flags[@]}"
