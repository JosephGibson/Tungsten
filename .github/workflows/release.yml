# Release builds (D-071, D-072, D-120, D-122, D-227). A pushed tag publishes:
# a final vX.Y.Z tag or a pre-release vX.Y.Z-<pre>; the release pull request is
# main's merge and starts nothing here. A manual run on a tag covers recovery.
# Each run checks the tag against Cargo.toml and CHANGELOG.md, builds the
# examples for Linux and Windows at two x86-64 CPU levels, each target and
# level on a runner of its own, and publishes one zip per platform for players
# (a launcher per example under its player-facing name that runs the fastest
# build the CPU supports, both builds and the files they read under data/,
# README.txt and the license notices; no debug files, D-196), SHA256SUMS and the
# matching changelog section as notes, once the tag still names the commit it
# built. A vX.Y.Z-<pre> tag without its own changelog section is a rehearsal,
# published as a pre-release. Hosted runners have no GPU: nothing with a window
# is launched. The one program run is the crash-report probe, which needs none
# and reports without failing the run (D-070, D-120). Release steps and
# recovery: docs/releases.md.
name: Release

on:
  # The owner's tag push publishes, final or pre-release (D-227).
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  # gh workflow run release.yml --ref vX.Y.Z
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Fastest first; each level builds into target/<level> on a build job of its
  # own per target, the matrix taking the list through the verify job (a matrix
  # can't read env). x86-64 is the portable fallback and supplies the launcher
  # and the crash-report probe. Measured in D-072.
  CPU_LEVELS: x86-64-v3 x86-64

jobs:
  verify:
    name: Tag, version and changelog agree
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.select.outputs.tag }}
      sha: ${{ steps.select.outputs.sha }}
      levels: ${{ steps.select.outputs.levels }}
    steps:
      # The default checkout of the tag: the commit it names.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the release tag
        id: select
        shell: bash
        run: |
          head=$(git rev-parse HEAD)
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo "::error::Run this workflow on a tag: gh workflow run release.yml --ref vX.Y.Z"
            exit 1
          fi
          tag=$GITHUB_REF_NAME
          python3 -B scripts/release.py check "$tag"
          {
            echo "tag=$tag"
            echo "sha=$head"
            python3 -c 'import json, os; print("levels=" + json.dumps(os.environ["CPU_LEVELS"].split()))'
          } >> "$GITHUB_OUTPUT"

  # One job per target and CPU level: the levels share no build, so they run at
  # once, about halving the run (a Windows level took 10-11 of its job's 22 min).
  build:
    name: Build (${{ matrix.target }}, ${{ matrix.level }})
    needs: verify
    if: needs.verify.outputs.tag != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # The others finish and upload when one fails, so rerunning the run's
      # failed jobs rebuilds only what failed.
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-pc-windows-msvc]
        level: ${{ fromJSON(needs.verify.outputs.levels) }}
        include:
          # Pinned image: its glibc (2.39) caps what the Linux binaries require.
          # An explicit build-id, which packaging and symbolization check (D-120),
          # whatever the runner's compiler defaults to.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            extra_rustflags: "-C link-arg=-Wl,--build-id"
            python: python3
          # Static CRT: players don't need the Visual C++ redistributable.
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            extra_rustflags: "-C target-feature=+crt-static"
            python: python
    env:
      TARGET: ${{ matrix.target }}
      LEVEL: ${{ matrix.level }}
      EXTRA_RUSTFLAGS: ${{ matrix.extra_rustflags }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      # Same list as ci.yml. cpal needs pkg-config and ALSA headers; gilrs
      # links libudev through pkg-config (D-220). X11/Wayland, xkbcommon and
      # Vulkan load at run time. Under a minute normally: a hung mirror held
      # it for 85 minutes once, so it fails fast for a rerun of the job.
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev

      # Reads rust-toolchain.toml. No cache: a cache saved on a tag ref is
      # rarely restored, and release builds start clean.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          build-warnings: ""
          cache: false

      # Binary targets are the examples, the template, which the archive ships
      # beside them (D-186), and the launcher. The test-only fixtures crate is
      # left out, so the example-* upload never sees its binary (D-193). The
      # tuned profile's line tables stay in; packaging strips the Linux copies
      # and the PDBs stay behind (D-196). A set RUSTFLAGS replaces
      # target-cpu=native from .cargo/config.toml.
      - name: Build release binaries at ${{ matrix.level }}
        run: |
          RUSTFLAGS="-C target-cpu=$LEVEL $EXTRA_RUSTFLAGS" cargo build --release --locked \
            --workspace --exclude tungsten-crash-probe --exclude example-03-fixtures --bins \
            --target "$TARGET" --target-dir "target/$LEVEL"

      # The crates the shipped binaries link, with their license files, and the
      # toolchain's standard-library notices, from which packaging writes each
      # archive's third-party notices (D-122). It lands at the artifact's root;
      # both of a target's jobs collect it, and publish compares the two.
      - name: Collect license data
        run: |
          ${{ matrix.python }} -B scripts/release.py licenses "$TARGET" --out target/licenses.json

      # Once per target, in the portable job, into its target dir: only the
      # probe's crate compiles.
      - name: Build the crash-report probe
        if: matrix.level == 'x86-64'
        run: |
          RUSTFLAGS="-C target-cpu=x86-64 $EXTRA_RUSTFLAGS" cargo build --release --locked \
            -p tungsten-crash-probe --target "$TARGET" --target-dir target/x86-64

      # A panic in an archive-like copy leaves a crash file that symbolizes from its
      # split debug file (Linux) or its PDB (Windows); the release ships neither
      # (D-196). Informational: a failure here is read on the rehearsal run, never
      # fails the release (D-120).
      - name: Crash-report probe
        if: matrix.level == 'x86-64'
        continue-on-error: true
        run: |
          ${{ matrix.python }} -B scripts/crash-report.py probe "target/x86-64/$TARGET/release" --target "$TARGET"

      # The patterns root every job's artifact at target/, so each holds
      # <level>/<target>/release/; the launcher pattern matches in the portable
      # job alone.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}.${{ matrix.level }}
          path: |
            target/*/${{ matrix.target }}/release/example-*
            target/*/${{ matrix.target }}/release/tungsten-template-basic*
            target/x86-64/${{ matrix.target }}/release/tungsten-launcher*
            target/licenses.json
            !target/*/${{ matrix.target }}/release/*.d
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Package and publish
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          path: parts

      # One artifact per target and level (bin-<target>.<level>); packaging
      # reads a target's levels from one folder. A target needs every
      # CPU_LEVELS build, since packaging takes whichever it finds, and its
      # jobs' license data must agree.
      - name: Gather each target's builds
        run: |
          for part in parts/bin-*; do
            name=${part#parts/bin-}
            dir=artifacts/bin-${name%.*}
            mkdir -p "$dir"
            if [[ -e "$dir/licenses.json" ]]; then
              cmp -- "$part/licenses.json" "$dir/licenses.json"
              rm -- "$part/licenses.json"
            fi
            mv -- "$part"/* "$dir/"
          done
          for dir in artifacts/bin-*; do
            for level in $CPU_LEVELS; do
              if [[ ! -d "$dir/$level" ]]; then
                echo "::error::${dir#artifacts/bin-} has no $level build"
                exit 1
              fi
            done
          done

      # A players' zip per built target, then checksums over them. Packaging
      # strips each Linux binary with objcopy (D-196) and writes the notices from
      # the build job's licenses.json, failing on a crate without a license text
      # (D-122).
      - name: Package archives and checksums
        run: |
          for dir in artifacts/bin-*; do
            python3 -B scripts/release.py package "$RELEASE_TAG" "${dir#artifacts/bin-}" \
              --bin-dir "$dir" --out dist
          done
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes from CHANGELOG.md
        run: |
          python3 -B scripts/release.py notes "$RELEASE_TAG" \
            --link-base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$RELEASE_TAG" > release-notes.md

      # A rerun of this job keeps the verify job's commit, so after the tag was
      # re-pointed (docs/releases.md, Recover according to state) it would
      # publish that commit's builds under a tag naming another one.
      - name: The tag still names the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type + " " + .object.sha')
          kind=${ref%% *}
          sha=${ref#* }
          if [[ "$kind" == tag ]]; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)
          fi
          if [[ "$sha" != "$BUILT_SHA" ]]; then
            echo "::error::$RELEASE_TAG names $sha, not $BUILT_SHA, which this run built; a run on the tag as it stands publishes it (a re-pointing push starts one)"
            exit 1
          fi
          echo "$RELEASE_TAG names $BUILT_SHA"

      # gh stages assets in a draft before publication. Existing drafts/releases
      # need inspection before retrying this create step; see docs/releases.md.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Tungsten $RELEASE_TAG" --notes-file release-notes.md "${flags[@]}"
