# CPU-only checks shared with local work (see AGENTS.md), and the CPU tests on
# Windows (W7a, D-121). GPU, audio and perf checks need real hardware and stay
# local; this workflow sets no performance thresholds and changes no branch
# protection.
name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - "0.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Generic x86-64 build: a set RUSTFLAGS replaces the target-cpu=native flags
  # in .cargo/config.toml, keeping cached artifacts portable across runner
  # CPUs. `x86-64` is rustc's default CPU for this target; it's spelled out so
  # the override can't be lost as an empty value. rust-cache keys include it.
  RUSTFLAGS: "-C target-cpu=x86-64"
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

jobs:
  cpu-checks:
    name: CPU checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Seconds, before any install: Cargo.toml's version, the CHANGELOG.md
      # headings and the DESIGN status line agree (D-071, D-074). `just
      # repo-check` repeats it for local runs.
      - name: Version and changelog consistency
        run: python3 -B scripts/release.py check

      # Starting set for cpal (ALSA) and friends; a first clean run confirms
      # whether anything else is needed.
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev

      # Reads rust-toolchain.toml (Rust 1.98.1 + rustfmt, clippy) and caches
      # with keys covering the compiler, Cargo.lock and RUST* env vars.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # Leave warnings to `just lint` (clippy -D warnings), as locally.
          build-warnings: ""

      - name: Install ShellCheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum -c -
          tar -xJf "${archive}"
          sudo install -m 0755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # `just script-test` lints the workflows; actionlint also runs ShellCheck
      # over `run:` scripts, so it installs after it.
      - name: Install actionlint ${{ env.ACTIONLINT_VERSION }}
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Install just and cargo-deny
        run: cargo install --locked just@1.58.0 cargo-deny@0.20.2

      - name: Format, strict clippy, tests (incl. doctests)
        run: just check

      # In the dev profile `just check` just built: the bench profile's thin LTO
      # and single codegen unit took 148-193 s here, and `just lint` already
      # type-checks the benches (D-112).
      - name: Build benchmarks
        run: cargo bench --workspace --no-run --profile dev --locked

      - name: Dependency policy
        run: just deps

      - name: Agent instruction checks
        run: just ctx

      - name: Repository metadata checks
        run: just repo-check

      - name: Script lint and regression tests
        run: just script-test

  # W7a (D-121): the CPU tests on the image the release build uses, which no
  # other job tests on. Informational like the rest; no required check.
  windows-tests:
    name: CPU tests (Windows)
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      # Before checkout: the image's git would give the tree's text files CRLF.
      - name: Keep committed line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          build-warnings: ""

      - name: Tests (dev profile)
        run: cargo test --workspace --locked
