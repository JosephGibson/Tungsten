[package]
name = "tungsten"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Umbrella crate and winit application loop for the Tungsten 2D engine"

[features]
# The headless test harness, `tungsten::testing` (`D-110`); games enable it as
# a dev-dependency feature.
testing = []

[dependencies]
tungsten-core = { workspace = true }
tungsten-render = { workspace = true }
winit = { workspace = true }
glam = { workspace = true }
image = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
cpal = { workspace = true }
notify = { workspace = true }
rtrb = { workspace = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "particle_tick"
harness = false

[lints]
workspace = true
