<title>Tungsten 1.0 Roadmap</title>
<style>
/* One column, at most 960px: sticky header, Next, phase strip, route, open questions, legend. Dark only, on OLED black.
   Dracula accents with one meaning per hue (the meaning tokens: session, owner, done, warn, gate, spike, api, idle);
   white marks "here"; comment is never text (4.46:1 on black). */
:root {
  color-scheme: dark;
  --cyan: #8be9fd; --green: #50fa7b; --orange: #ffb86c; --pink: #ff79c6; --purple: #bd93f9;
  --red: #ff5555; --yellow: #f1fa8c; --comment: #6272a4; --selection: #44475a;
  --session: var(--cyan); --owner: var(--orange); --done: var(--green); --warn: var(--red);
  --gate: var(--purple); --spike: var(--yellow); --api: var(--pink); --idle: var(--comment);
  --bg: #000000; --panel: #121218; --raised: #1c1c25; --hover: #262631; --here-bg: #17171f; --row-hover: #0b0b10; --line: #24242d;
  --fg: #f8f8f2; --fg-2: #dfe2ee; --fg-3: #a9b0cc; /* three steps of blue-grey white: text, secondary text, labels */
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
html, body { background: var(--bg); color: var(--fg); }
html { scrollbar-color: var(--selection) var(--bg); }
body { font: 14px/1.5 var(--sans); padding-inline: 16px; -webkit-font-smoothing: antialiased; }
::selection { background: var(--selection); color: var(--fg); }
main { max-width: 960px; margin: 0 auto; padding-block: 20px 48px; display: grid; gap: 28px; min-width: 0; }
h1, h2, h3, p, ol, ul, dl, dd { margin: 0; }
ol, ul { padding: 0; list-style: none; }
h2 { font-size: 16px; font-weight: 650; text-wrap: balance; }
h3 { font-size: 14px; font-weight: 650; }
/* Eyebrows: the small uppercase labels that name a block (group heads, the Next card's parts). Titles stay sentence case. */
.eb { font: 600 11.5px/1.5 var(--sans); text-transform: uppercase; letter-spacing: .08em; }
code, pre, .mono { font-family: var(--mono); }
.mono, .chip, .ph .c, .facts dd, .tree dd { font-variant-numeric: tabular-nums; }
button { font: 600 13px/1 var(--sans); color: var(--fg); background: var(--raised); border: 1px solid var(--idle); border-radius: 5px; padding: 8px 12px; cursor: pointer; transition: background-color .12s, border-color .12s; }
button:hover { background: var(--hover); border-color: var(--fg-3); }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
summary { cursor: pointer; list-style: none; }
summary::-webkit-details-marker { display: none; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.st-plan, .st-ready, .st-review { color: var(--owner); }
.st-run { color: var(--session); }
.st-done { color: var(--done); }
.st-todo, .st-skip { color: var(--fg-3); }
.warn-t { color: var(--warn); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; max-width: 960px; margin: 0 auto; background: var(--bg); display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--line); padding-block: 14px 12px; }
.top h1 { font-size: 21px; font-weight: 700; letter-spacing: -.01em; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; min-width: 0; }
.top h1 .crumb { font-size: 14px; font-weight: 500; color: var(--fg-2); display: inline-flex; flex-wrap: wrap; gap: 2px 7px; align-items: baseline; }
.top h1 .crumb b { color: var(--fg); font-weight: 650; }
.top h1 .tag { font: 600 12px/1.4 var(--mono); color: var(--fg-2); border: 1px solid var(--idle); border-radius: 4px; padding: 0 6px; }
.sync { font-size: 12px; color: var(--fg-3); }
.sync .mono { color: var(--fg-2); }

.note-box { border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 6px; background: var(--panel); }
.note-box p { color: var(--fg-2); max-width: 70ch; }
.note-box.warn { border-color: var(--warn); }
.note-box.warn h2 { color: var(--warn); }

.next { border: 1px solid var(--session); border-radius: 10px; background: var(--panel); padding: 14px 16px 12px; display: grid; gap: 10px; min-width: 0; box-shadow: 0 0 0 3px color-mix(in srgb, var(--session) 12%, transparent); }
.next.you { border-color: var(--owner); box-shadow: 0 0 0 3px color-mix(in srgb, var(--owner) 12%, transparent); }
.next-head { display: flex; flex-wrap: wrap; gap: 4px 7px; align-items: baseline; }
.next-head h2 { color: var(--session); }
.next.you .next-head h2 { color: var(--owner); }
.next-head .jump { margin-left: auto; padding: 5px 10px; font-size: 12px; }
.where { color: var(--session); }
.where.you { color: var(--owner); }
.where::before { content: "·"; color: var(--fg-3); margin-right: 7px; }
.rec { font-size: 12px; color: var(--fg-2); }
.rec b { font-weight: 600; color: var(--fg); }
.lead { font-size: 13px; color: var(--fg-2); max-width: 80ch; }
.title-block { display: grid; gap: 2px; margin-top: -4px; }
.title-row { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; }
.next-title { font-size: 18px; font-weight: 700; letter-spacing: -.01em; line-height: 1.3; }
.prompt { display: grid; min-width: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
.prompt-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 5px 6px 5px 12px; background: var(--raised); border-bottom: 1px solid var(--line); color: var(--fg-3); }
.prompt pre { margin: 0; padding: 10px 12px; font-size: 13px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg); }
.prompt pre.clamp { max-height: calc(4.4 * 1.55em + 10px); overflow: hidden; mask-image: linear-gradient(#000 40%, transparent 96%); -webkit-mask-image: linear-gradient(#000 40%, transparent 96%); } /* the first four lines fading out; Show all opens the rest */
.prompt-head .acts { display: flex; gap: 6px; }
.prompt button { padding: 3px 10px; font-size: 12px; min-width: 5.5em; background: var(--bg); }
.prompt button.more { min-width: 0; border-color: transparent; color: var(--fg-2); }
.prompt button:hover { background: var(--hover); }
.rec-item { display: grid; gap: 6px; min-width: 0; }
.sub { display: grid; gap: 4px; min-width: 0; }
.sub > h3 { color: var(--fg-3); }
.pg { font-size: 13px; color: var(--fg-2); overflow-wrap: anywhere; }
.bar { display: block; height: 6px; max-width: 320px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--done); }
.oq { display: grid; gap: 6px; }
.oq li { display: grid; grid-template-columns: 3em minmax(0, 1fr); gap: 2px 10px; font-size: 13px; }
.oq .id { font-family: var(--mono); font-size: 12px; color: var(--owner); padding-top: 1px; }
.oq .meta { grid-column: 2; color: var(--fg-3); }
.flow { display: grid; gap: 2px; }
.flow li { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: center; padding: 4px 0; border-top: 1px solid var(--line); }
.flow li:first-child { border-top: 0; }
.flow label { display: flex; gap: 10px; align-items: center; cursor: pointer; }
.flow .t { font-weight: 500; color: var(--fg-2); }
.flow li[aria-current] .t { font-weight: 700; color: var(--fg); }
.flow .w { font-size: 12px; color: var(--session); }
.flow .w.you { color: var(--owner); }
.flow .up { font-size: 12px; font-weight: 650; color: var(--fg); border: 1px solid var(--fg); border-radius: 4px; padding: 1px 6px; }
.flow li.past .t { color: var(--fg-3); }
.flow li.ticked .t { text-decoration: line-through; }
.flow li.past:not(.ticked) .t::before { content: "✓ "; content: "✓ " / ""; color: var(--done); }
input[type=checkbox] { appearance: none; margin: 0; width: 18px; height: 18px; flex: none; border: 1.5px solid var(--idle); border-radius: 4px; background: var(--raised); display: grid; place-items: center; cursor: pointer; }
input[type=checkbox]::after { content: ""; width: 9px; height: 5px; border: solid var(--bg); border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px, -1px); opacity: 0; }
input[type=checkbox]:checked { background: var(--done); border-color: var(--done); }
input[type=checkbox]:checked::after { opacity: 1; }
input[type=checkbox]:disabled { cursor: default; }
.after { font-size: 13px; color: var(--fg-2); }
.after .eb { color: var(--fg-3); margin-right: 8px; }
.after .ar { color: var(--fg-3); }
.heads { display: grid; gap: 3px; }
.heads > h3 { color: var(--warn); }
.heads ul { display: grid; gap: 3px; }
.heads li { padding-left: 14px; position: relative; color: var(--fg); font-size: 13px; }
.heads li::before { content: "!"; position: absolute; left: 0; font-weight: 700; color: var(--warn); }
.fold > summary { font-size: 13px; font-weight: 600; color: var(--fg-2); }
.fold > summary::before { content: "▸ "; color: var(--fg-3); }
.fold[open] > summary::before { content: "▾ "; }
.fold[open] > summary { margin-bottom: 8px; }
.recovery { display: grid; gap: 14px; }
.recovery h3 { font-size: 13px; font-weight: 600; color: var(--fg-2); display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.tree { display: grid; grid-template-columns: 11em minmax(0, 1fr); gap: 4px 14px; font-size: 13px; }
.tree dt { color: var(--fg-3); }
.tree dd { color: var(--fg-2); overflow-wrap: anywhere; }

.strip { display: grid; gap: 8px; }
.ph { display: grid; grid-template-columns: 9.5em 3.5em minmax(0, 1fr); gap: 6px 12px; align-items: center; font-size: 13px; }
.ph .n { color: var(--fg-2); font-weight: 600; }
.ph .c { font-family: var(--mono); font-size: 12px; color: var(--fg-3); }
.cells { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.cells a { display: block; width: 11px; height: 11px; border-radius: 2px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--idle); transition: transform .12s; }
.cells a:hover { transform: scale(1.25); }
.cells a.gate { width: 9px; height: 9px; transform: rotate(45deg); margin: 0 2px; }
.cells a.gate:hover { transform: rotate(45deg) scale(1.25); }
.cells a.s-done { background: var(--done); box-shadow: none; }
.cells a.s-run { background: var(--session); box-shadow: none; }
.cells a.s-plan, .cells a.s-ready, .cells a.s-review { background: var(--owner); box-shadow: none; }
.cells a.s-skip { background: transparent; box-shadow: none; outline: 1px dotted var(--idle); outline-offset: -1px; }
.cells a.here { outline: 2px solid var(--fg); outline-offset: 1px; }
@media (max-width: 560px) {
  .ph { grid-template-columns: minmax(0, 1fr) auto; } .cells { grid-column: 1 / -1; }
  .tree { grid-template-columns: minmax(0, 1fr); } .tree dd { margin-bottom: 6px; }
}

.phase { display: grid; gap: 4px; }
.phase-head { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; justify-content: space-between; padding-bottom: 8px; border-bottom: 1px solid var(--idle); }
.phase-head h2 { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.phase-head .c { font-size: 13px; color: var(--fg-3); }
.intro { color: var(--fg-2); font-size: 13px; max-width: 75ch; padding-top: 4px; }
.grp { padding-top: 22px; display: grid; }
.grp-head { display: flex; flex-wrap: wrap; gap: 0 10px; align-items: baseline; padding-bottom: 6px; }
.grp-head h3 { color: var(--fg-2); }
.grp-head span { font-size: 13px; color: var(--fg-3); }
.done-fold > summary { padding: 8px 0 8px 28px; font-size: 13px; color: var(--fg-3); border-top: 1px solid var(--line); position: relative; }
.done-fold > summary::before { content: "▶"; content: "▶" / ""; position: absolute; left: 10px; top: 11px; font-size: 9px; color: var(--fg-3); transition: transform .15s; }
.done-fold[open] > summary::before { transform: rotate(90deg); }
.done-fold > summary b { color: var(--done); font-weight: 600; }
.done-fold > summary::after { content: " · show"; color: var(--fg-2); }
.done-fold[open] > summary::after { content: " · hide"; }

/* A stop is a row while closed and a card while open: the panel fill and outline mark where its body ends. */
.stop { border-top: 1px solid var(--line); }
.stop > summary { display: grid; grid-template-columns: 12px minmax(5.5em, 10em) minmax(0, 1fr); gap: 2px 10px; align-items: baseline; padding: 10px 8px 10px 6px; transition: background-color .12s; }
.stop > summary:hover { background: var(--row-hover); }
.stop > summary:hover .chev { color: var(--fg); }
.stop.here > summary { background: var(--here-bg); box-shadow: inset 3px 0 0 var(--fg); }
.stop[open] { background: var(--panel); border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line); border-top-color: transparent; margin-block: 6px; }
.stop[open] > summary { border-radius: 8px 8px 0 0; } /* no overflow clip, so the focus ring stays whole */
.stop[open] > summary:hover { background: var(--raised); }
.stop.here[open] { box-shadow: inset 3px 0 0 var(--fg), inset 0 0 0 1px var(--line); }
.stop.here[open] > summary { box-shadow: none; }
.chev { margin-left: auto; align-self: center; color: var(--fg-3); font-size: 9px; line-height: 1; transition: transform .15s, color .12s; }
.chev::before { content: "▶"; content: "▶" / ""; }
.stop[open] .chev { transform: rotate(90deg); }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--idle); align-self: start; margin-top: 5px; overflow: hidden; text-indent: 20px; white-space: nowrap; color: var(--fg); }
.dot.s-done { background: var(--done); border-color: var(--done); }
.dot.s-run { background: var(--session); border-color: var(--session); }
.dot.s-plan, .dot.s-ready, .dot.s-review { background: var(--owner); border-color: var(--owner); }
.dot.s-skip { border-style: dotted; }
.dot.k-gate { border-radius: 2px; transform: rotate(45deg); width: 9px; height: 9px; margin-top: 6px; }
.here .dot { box-shadow: 0 0 0 2px var(--fg); }
.lab { font: 500 12px/1.5 var(--mono); color: var(--fg-2); overflow-wrap: anywhere; }
.main-col { display: flex; flex-wrap: wrap; gap: 3px 12px; align-items: baseline; min-width: 0; }
.ti { font-size: 15px; font-weight: 600; flex: 1 1 auto; min-width: 0; }
.done .ti { color: var(--fg-2); font-weight: 500; }
.done .lab { color: var(--fg-3); }
.lab.k-gate { color: var(--gate); }
.lab.k-spike { color: var(--spike); }
/* Chips: pills tinted by the page's hue meanings. Orange waits on you (a status, level C, your role), cyan is the
   session's model, pink a public API or dependency, green a shipped release, yellow an experiment; ratings and checks stay neutral. */
.chips { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 4px 5px; align-items: center; } /* always its own line, so every row reads title, chips, stages */
.chip { --c: var(--fg-2); position: relative; display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; line-height: 17px; white-space: nowrap;
  color: var(--c); background: color-mix(in srgb, var(--c) 9%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 24%, transparent); }
.chip .k { color: color-mix(in srgb, var(--c) 70%, transparent); } /* the chip's label; its value follows */
.chip .v { font-family: var(--mono); font-weight: 600; }
.chip .sep { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; } /* copied, not seen */
.t-owner { --c: var(--owner); } .t-session { --c: var(--session); } .t-api { --c: var(--api); } .t-done { --c: var(--done); } .t-spike { --c: var(--spike); } .t-dim { --c: var(--fg-3); }
.chip.st.s-plan, .chip.st.s-ready, .chip.st.s-review { --c: var(--owner); }
.chip.st.s-run { --c: var(--session); }
.chip.st.s-skip { --c: var(--fg-3); }
.stages { flex-basis: 100%; min-width: 0; font: 12px/1.5 var(--mono); }
.stages.none { color: var(--fg-3); font-family: var(--sans); }
.chain { display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline; }
.chain .ar { color: var(--fg-3); }
.sg { color: var(--session); }
.sg.you { color: var(--owner); }
.sg.noted { text-decoration: underline dotted; text-underline-offset: 3px; }
.sg.past { color: var(--fg-3); }
.sg.past::before { content: "✓"; content: "✓" / ""; color: var(--done); margin-right: 3px; }
.sg.cur { font-weight: 700; text-decoration: underline solid 2px; text-underline-offset: 3px; }
.body { padding: 4px 16px 18px calc(38px + 10em); display: grid; gap: 12px; max-width: 76ch; } /* its left edge is the title column's */
.body .sum { color: var(--fg); }
.body .nt { color: var(--fg-3); font-size: 13px; }
.facts { display: grid; grid-template-columns: 9em minmax(0, 1fr); gap: 7px 14px; font-size: 13px; align-items: baseline; }
.facts dt { color: var(--fg-3); }
.facts dd { color: var(--fg-2); overflow-wrap: anywhere; }
.facts dd b { font-weight: 600; }
.facts dd .mono { font-size: 12px; }
.stage-list { display: grid; gap: 5px; }
.stage-list li { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 0 10px; align-items: baseline; }
.stage-list .sg { font: 12px/1.5 var(--mono); }
.stage-list .rec { font-size: 13px; }
.stage-list .nt { color: var(--fg-3); font-size: 13px; }
@media (max-width: 560px) {
  .stop > summary { grid-template-columns: 12px minmax(0, 1fr); }
  .stop > summary .main-col { grid-column: 2; }
  .body { padding-left: 28px; }
  .facts { grid-template-columns: minmax(0, 1fr); } .facts dd { margin-bottom: 4px; }
  .stage-list li { grid-template-columns: minmax(0, 1fr); }
}

.qs { display: grid; gap: 0; }
.qs-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; align-items: baseline; padding-bottom: 6px; border-bottom: 1px solid var(--idle); }
.qs-head span { font-size: 13px; color: var(--fg-3); }
.q { display: grid; grid-template-columns: 3em minmax(0, 1fr); gap: 2px 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.q:first-of-type { border-top: 0; }
.q .id { font-family: var(--mono); font-size: 12px; color: var(--owner); padding-top: 2px; }
.q .meta { grid-column: 2; font-size: 13px; color: var(--fg-3); }
.q.answered .id { color: var(--done); }
.q.answered .qt { color: var(--fg-2); }
.answered-fold > summary { padding: 8px 0; font-size: 13px; color: var(--fg-2); border-top: 1px solid var(--line); }

footer { display: grid; gap: 8px; font-size: 12px; color: var(--fg-3); border-top: 1px solid var(--line); padding-top: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.legend li { display: flex; gap: 6px; align-items: center; }
.legend b { font-weight: 600; }
.sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.sw.session { background: var(--session); } .sw.owner { background: var(--owner); } .sw.done { background: var(--done); } .sw.warn { background: var(--warn); }
.sw.gate { background: var(--gate); } .sw.spike { background: var(--spike); } .sw.api { background: var(--api); } .sw.here { background: var(--fg); }
.sw.idle { background: var(--raised); box-shadow: inset 0 0 0 1px var(--idle); }
.c-session { color: var(--session); } .c-owner { color: var(--owner); } .c-done { color: var(--done); } .c-warn { color: var(--warn); }
.c-gate { color: var(--gate); } .c-spike { color: var(--spike); } .c-api { color: var(--api); } .c-here { color: var(--fg); }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--raised); border: 1px solid var(--idle); border-radius: 6px; padding: 8px 12px; font-size: 13px; color: var(--fg); }
.toast.warn { border-color: var(--warn); box-shadow: inset 3px 0 0 var(--warn); }
</style>

<header class="top" id="top"><h1>Tungsten 1.0</h1><span class="sync" id="sync">connecting</span></header>
<main id="app" aria-busy="true">
  <section class="note-box" id="loading">
    <h2>Loading the road to 1.0</h2>
    <p>The next prompt, the route through the three phases and the open questions appear once the page's database answers.</p>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
"use strict";
const SCHEMA = 2; // the catalog shape this page is built for (D-118)
const READS = [1, 2]; // schema 1, from before D-118, renders without stages
const CACHE = "tungsten-roadmap-cache", OPEN = "tungsten-roadmap-open";
const STATUS = { todo: "not started", plan: "plan in review", run: "running", ready: "ready to ship", review: "release PR open", done: "done", skip: "skipped" };
const WHERE = { new: "new session", same: "same session", you: "you" };
const MODE = { auto: "auto mode", plan: "plan mode" };
const LEVEL = { A: "A · unattended", B: "B · approved design", C: "C · owner in the loop", S: "S · experiment" };
const CX = ["", "S", "M", "L", "XL"]; // the catalog rates complexity 1–4; the page shows it on effort's scale
const ROLE = { decide: "you decide", api: "you review the API", hands: "you check by hand", play: "you play" };

    ontoggle: () => { setOpen(s.id, det.open); if (det.open) fillBody(s, body); } },
    h("summary", null,
      h("span", { class: "dot s-" + st + (s.kind === "gate" ? " k-gate" : ""), text: s.id === here ? "here, " + STATUS[st] : STATUS[st] }),
      h("span", { class: "lab k-" + s.kind, text: s.label || s.kind }),
      h("span", { class: "main-col" }, h("span", { class: "ti", text: s.title }), h("span", { class: "chev", "aria-hidden": "true" }), chips(s), st === "done" ? null : chain(s))), // a finished stop's chain is all ticks: the body lists its stages
    body);
  if (S.open.has(s.id)) { det.open = true; fillBody(s, body); }
  return det;
}

function route(here) {
  return S.catalog.phases.map(p => {
    const groups = S.catalog.groups.filter(g => g.phase === p.num);
    const all = S.catalog.stops.filter(s => phaseOf(s) === p.num);
    const done = all.filter(s => statusOf(s.id) === "done").length;
    return h("section", { class: "phase", "aria-labelledby": "ph-" + p.num },
      h("div", { class: "phase-head" }, h("h2", { id: "ph-" + p.num, text: "Phase " + p.num + " · " + p.name }), h("span", { class: "c", text: done + " of " + all.length + " done" })),
      p.intro ? h("p", { class: "intro", text: p.intro }) : null,
      groups.map(g => {
        const stops = S.catalog.stops.filter(s => s.group === g.id);
        if (!stops.length) return null;
        const finished = stops.filter(s => statusOf(s.id) === "done"), rest = stops.filter(s => statusOf(s.id) !== "done");
        const key = "done-" + g.id;
        const doneFold = finished.length ? h("details", { class: "done-fold", ontoggle: e => setOpen(key, e.target.open) },
          h("summary", null, h("b", { text: finished.length + " done" })), finished.map(s => stopRow(s, here))) : null;
        if (doneFold && S.open.has(key)) doneFold.open = true;
        return h("div", { class: "grp" },
          h("div", { class: "grp-head" }, h("h3", { class: "eb", text: g.name }), g.note ? h("span", { text: g.note }) : null),
          doneFold, rest.map(s => stopRow(s, here)));
      }));
  });
}

function questions() {
  const qs = S.catalog.questions || [];
  const open = qs.filter(q => q.state === "open"), answered = qs.filter(q => q.state !== "open");
  const row = q => h("div", { class: "q" + (q.state === "open" ? "" : " answered") },
    h("span", { class: "id", text: "Q" + q.id.slice(1) }),
    h("span", { class: "qt", text: q.text }),
    h("span", { class: "meta", text: q.state === "open" ? ["needed by " + (q.by || "—"), q.default ? "default: " + q.default : ""].filter(Boolean).join(" · ") : (q.state === "default" ? "at its default: " : "answered: ") + (q.answer || "") }));
  return h("section", { class: "qs", "aria-labelledby": "qs-h" },
    h("div", { class: "qs-head" }, h("h2", { id: "qs-h", text: "Open questions · " + open.length }), h("span", { text: "needed by · default" })),
    open.map(row),
    answered.length ? fold("fold:answered", "Answered · " + answered.length, answered.map(row), "answered-fold") : null);
}

function footer() {
  return h("footer", null,
    h("ul", { class: "legend", "aria-label": "What each color means" }, LEGEND.map(([k, name, meaning]) =>
      h("li", null, h("i", { class: "sw " + k }), h("span", null, h("b", { class: k === "idle" ? null : "c-" + k, text: name }), " " + meaning)))),
    h("p", null, "Chips on a stop: its level, complexity and effort from the catalog; the model and reasoning effort its current stage's session runs on (a finished stop's run session got); what waits on you; the checks its work needs; public API flags; its release. Orange chips wait on you, cyan is the session's model, pink a public API or dependency, green a shipped release, yellow an experiment."),
    h("p", null, "Stages: the underlined one is current, ✓ is done, a dotted one has a note (hover it). Each session stage shows its mode, model and effort; a same-session stage keeps its session's."),
    h("p", null, "Data: ", h("span", { class: "mono", text: "docs/plans/1.0/roadmap.json" }), ", the Flow table in ", h("span", { class: "mono", text: "prompts.md" }),
      " and the tree, synced by ", h("span", { class: "mono", text: "/tungsten-next" }),
      ". Page: ", h("span", { class: "mono", text: ".claude/skills/tungsten-next/page.html" }),
      S.hash ? [". Catalog ", h("span", { class: "mono", text: S.hash })] : null, "."));
}

function message(title, text, warn) {
  header();
  app.replaceChildren(h("section", { class: "note-box" + (warn ? " warn" : "") }, h("h2", { text: title }), h("p", { text })));
}

let queued = false;
const marked = {}; // one performance mark per source on its first rendered rows, for timing live loads
function schedule() { if (!queued) { queued = true; requestAnimationFrame(render); } }
function render() {
  queued = false;
  if (!S.catalog) {
    if (S.source === "off") return message("This copy can't reach the roadmap", "The stops and the next prompt load from the page's database inside claude.ai. In Claude Code, /tungsten-next gives the same answer in the terminal.");
    if (S.source === "error") return message("The roadmap's database stopped answering", S.error || "Reload the page.", true);
    if (S.meta) return message("Nothing synced yet", "The database holds no catalog. Run /tungsten-next in Claude Code to write it.");
    header();
    app.replaceChildren(document.getElementById("loading") || h("section"));
    return;
  }
  if (!READS.includes(S.catalog.schema)) {
    const newer = S.catalog.schema > SCHEMA;
    return message(newer ? "This page is older than its data" : "The data is older than this page", "The database holds catalog schema " + S.catalog.schema + "; this page reads schemas " + READS.join(" and ") + ". " +
      (newer ? "Republish .claude/skills/tungsten-next/page.html." : "Run /tungsten-next in Claude Code to rewrite the catalog."), true);
  }
  for (const g of S.catalog.groups) groupPhase[g.id] = g.phase;
  const here = current();
  header();
  app.replaceChildren(nextBlock(), strip(here), ...route(here), questions(), footer());
  app.removeAttribute("aria-busy");
  if (!marked[S.source]) { marked[S.source] = true; performance.mark("roadmap:rows:" + S.source); }
  if (!S.jumped) { S.jumped = true; jumpToHash(); }
}

function save() {
  if (S.source !== "live" || !S.catalog) return;
  try { localStorage.setItem(CACHE, JSON.stringify({ schema: SCHEMA, hash: S.hash, catalog: S.catalog, now: S.now, stops: S.stops })); } catch (e) { /* per-viewer convenience only */ }
}
function restore() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE) || "null");
    if (!c || c.schema !== SCHEMA || !c.catalog || !READS.includes(c.catalog.schema)) { localStorage.removeItem(CACHE); return; }
    Object.assign(S, { catalog: c.catalog, hash: c.hash, now: c.now, stops: c.stops || {}, source: "cache" });
  } catch (e) { /* no cache: render from the database */ }
}

function fail(e) {
  if (S.source === "live" || S.source === "cache" || S.source === "wait") { S.source = S.catalog ? "off" : "error"; S.error = e && e.message ? "The database said: " + e.message : ""; }
  schedule();
}
function goLive() {
  if (!(S.meta && S.rows)) return;
  S.source = "live"; save(); schedule();
}

async function connect() {
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { S.source = "off"; schedule(); return; }
  S.db = db;
  db.collection("meta").onSnapshot(snap => {
    for (const d of snap.docs) {
      const v = d.data();
      if (d.id === "catalog" && v && v.catalog) { S.catalog = v.catalog; S.hash = v.hash || null; }
      if (d.id === "now") S.now = v || null;
    }
    S.meta = true; goLive();
  }, fail);
  db.collection("stops").onSnapshot(snap => {
    const m = {};
    for (const d of snap.docs) m[d.id] = d.data();
    S.stops = m; S.rows = true; goLive();
  }, fail);
}

recall();
restore();
render();
connect();
addEventListener("hashchange", () => { if (S.catalog) jumpToHash(); });
setInterval(() => { if (S.now) header(); }, 60000);
requestAnimationFrame(() => setTimeout(() => {
  const l = document.createElement("link");
  l.rel = "stylesheet";
  l.href = "https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap";
  document.head.append(l);
}, 0));
})();
</script>
